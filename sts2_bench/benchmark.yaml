# sts2_bench 默认运行配置。
# 这个文件会被 git 追踪，用来固定 benchmark 的非敏感实验参数。
# API key 不要写在这里；请写到仓库根目录的 .env。

# 选择使用的 agent。random 表示随机策略；llm 表示调用 OpenAI-compatible API。
agent: random

# OpenAI-compatible API 的基础地址。DeepSeek 可以使用 https://api.deepseek.com 或 https://api.deepseek.com/v1。
base_url: ""

# 调用的模型名称。需要和对应 API provider 支持的模型名一致。
model: ""

# 单次 LLM HTTP 请求超时时间，单位秒。调试 DeepSeek 卡住时可以先设为 15-30。
llm_timeout: 30

# LLM 请求或 JSON 解析失败后的重试次数。正式 benchmark 至少保留 1 次严格纠错请求；
# 调试连通性时可以临时设为 0，避免每一步等待太久。
llm_max_retries: 1

# 所有 LLM 重试失败后的处理。error 会停止当前 run 并记录错误；action 才会使用确定性动作回退。
llm_fallback_mode: error

# LLM 采样温度。严肃 benchmark 默认 0.0，避免模型采样随机性影响复现实验。
llm_temperature: 0.0

# Prompt 模板风格。default 输出简短 JSON；analysis 要求模型给出局势分析、计算、候选动作比较后再选择 action。
prompt_style: default

# 是否在 prompt 中附加 Compact state JSON。false 可以减少 token 和重复信息；true 适合调试结构化 state。
include_json_state: false

# 是否在 agent prompt 中加入局内短期记忆。这个记忆属于 agent 方法，不属于环境原始 state。
# 如果 context_management.mode 设为 turn_chat，请把这里设为 false，避免两套上下文方法同时生效。
memory_enabled: false

# 短期记忆保留最近多少个已选择 action。数值越大越能记住近期操作，但 prompt 会更长。
memory_window: 8

# 记忆内容类型。action_reason 记录模型旧理由；factual_diff 记录 action 后真实 state 变化，更适合严肃 benchmark。
memory_mode: factual_diff

# 是否在 prompt 中加入规则生成的短 run summary。属于 agent 方法，可用 --no-run-summary 做消融。
run_summary_enabled: false

# Agent 侧上下文管理方法。single_turn 是当前每步独立 prompt；turn_chat 只在同一个玩家出牌回合内保留短 chat history。
context_management:
  mode: single_turn
  route_plan:
    # 是否启用 map_select 的 route_plan_event prompt 与 runner 校验。
    # 关闭后每次地图选择都只基于当前 state / route graph / legal_actions 决策。
    enabled: false
    # hard 会在 route_plan_event 不一致时重问；soft 只记录错误，方便观察 plan 行为。
    enforcement: soft
  run_plan:
    route_plan:
      # 是否启用 OCC RunPlan.route_plan 这个长期路线承诺字段。
      # 关闭后 OCC prompt 不展示该字段，模型提交的 run_plan_patch.route_plan 也会被忽略。
      enabled: true
  turn_chat:
    # 同一玩家出牌回合内保留最近多少组 user/assistant 消息。
    window: 10
    # 第一版只支持 delta：新回合第一条是完整状态，后续同回合只给更新和合法动作。
    update_mode: delta
    # 第一版只支持 compact：历史里的 assistant 只保留 action 和简短 reason，不保留完整分析。
    assistant_history: compact
    # 是否在 combat turn_chat prompt 中要求模型输出当前状态的 turn_check 检查。
    # turn_check 只用于生存/斩杀/当前第一步校验，不要求 follow 多步计划。
    turn_check:
      enabled: true
  combat:
    card_sequences:
      # 是否在 combat_play legal actions 中暴露一次执行多张牌的 sequence 动作。
      # 关闭后局内每次 LLM 决策只能选择单张牌、药水、view 或 end turn。
      enabled: true

# 诊断开关。self_consistency 默认关闭；打开后只在指定 decision 上重复采样并记录投票分布，
# 不改变实际执行的 primary action。适合观察模型是否对选路/选牌有稳定偏好。
diagnostics:
  self_consistency:
    enabled: false
    samples: 3
    decisions: map_select,card_reward
    # diagnostic 只记录投票分布；majority_vote 只会在 map_select/card_reward 执行严格多数胜出的 action。
    # combat_play/card_select 等局内动作即使误配进 decisions，也只记录诊断并保留 primary action。
    mode: diagnostic
  # reflection 与 self_consistency 并行：为每个非 view 候选分别生成 forced counterfactual report，
  # 再由 verifier 只基于这些平等生成的候选报告横向选择。
  # 默认只作用 card_reward：用补短板/收益是否超过稀释的 rubric 校正无脑抓牌，
  # 避免 combat_reward/event/shop/rest_site 的高成本和高 schema 错误率。
  reflection:
    enabled: false
    decisions: card_reward
    # diagnostic 只记录 verifier 结论；verifier_vote 会执行 verifier 选择的非 view action。
    mode: diagnostic
    # 候选太多时跳过 reflection，避免商店/复杂事件一次消耗过大；成本约为候选数 + 1 次额外 LLM call。
    max_options: 8
  # legal action 在 prompt 中的展示顺序。default 保持 runner 原顺序；
  # shuffle_map 只打乱 map_select 的 map candidates，保留真实 action_id，用于检测候选顺序偏好。
  action_prompt_order:
    mode: default
    seed: 0

# coordinator 的选牌 posterior evaluator 当前默认关闭，避免和 RunPlan/OCC route 这条 baseline 混在一起。
reward_posterior_evaluator: false

# 选择角色。可选 Ironclad、Silent、Defect、Regent、Necrobinder。
character: Ironclad

# 进阶等级。0 表示无进阶，适合初始 benchmark。
ascension: 0

# 状态文本语言。en 使用英文；zh 使用中文。
lang: en

# 固定 seed 文件路径。空字符串表示自动生成 bench_0000、bench_0001 等 seed。
seeds: ""

# 本次运行的局数。
count: 1

# 每局最多允许的决策步数。这是安全上限；做爬塔层数 benchmark 时应设置得足够大。
max_steps: 300

# JSONL 输出路径。空字符串表示不写 trace 文件，只在终端打印结果。
out: results/random_ironclad_a0.jsonl

# JSONL 记录详细程度。metrics 最小；decisions 记录轻量决策摘要；full 记录完整 state、prompt、raw response。
log_level: metrics

# 是否在终端打印每一步发给模型的 prompt。调试时可以 true，正式 benchmark 建议 false。
print_prompts: false

# 是否在终端打印模型原始输出、解析结果和最终选择的 action。
print_model_output: false

# 是否在 map_select 决策时自动附加完整地图。false 表示让模型主动选择 view map。
include_full_map: true

# 是否允许同一个 decision 内重复选择 view deck / view map。false 可以避免无意义重复查看。
allow_repeat_views: false
