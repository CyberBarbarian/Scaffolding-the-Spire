# sts2_bench 默认运行配置。
# 这个文件会被 git 追踪，用来固定 benchmark 的非敏感实验参数。
# API key 不要写在这里；请写到仓库根目录的 .env。

# 选择使用的 agent。coordinator 表示 OCC/CA 分工的 LLM agent；random 表示随机策略；llm 表示单 agent LLM。
agent: coordinator

# OpenAI-compatible API 的基础地址。代码会在末尾自动补 /v1/chat/completions。
base_url: "https://zgc.apihy.com"

# 调用的模型名称。最近路线/战斗基线实验使用 deepseek-v4-flash。
model: "deepseek-v4-flash"

# Non-secret relay model catalog for local experiment overrides.
# Keep API keys in .env. For APiHY, use STS2_BENCH_BASE_URL=https://zgc.apihy.com/v1.
model_catalog:
  apihy_deepseek:
    base_url: "https://zgc.apihy.com/v1"
    env_key: "DEEPSEEK_API_KEY"
    registry_env_key: "APIHY_DEEPSEEK_API_KEY"
    default_model: "deepseek-v4-pro"
    chat_models: "deepseek-r1, deepseek-r1-250528, deepseek-v3, deepseek-v3.1-250821, deepseek-v3.1-think-250821, deepseek-v3.2, deepseek-v3.2-think, deepseek-v4-flash, deepseek-v4-pro, glm-5.1"
  apihy_openai:
    base_url: "https://zgc.apihy.com/v1"
    env_key: "OPENAI_API_KEY"
    registry_env_key: "APIHY_OPENAI_API_KEY"
    default_model: "gpt-5.5"
    chat_models: "gpt-5, gpt-5-2025-08-07, gpt-5-mini, gpt-5-mini-2025-08-07, gpt-5.1, gpt-5.1-2025-11-13, gpt-5.1-codex, gpt-5.2, gpt-5.2-2025-12-11, gpt-5.2-codex, gpt-5.3-codex, gpt-5.4, gpt-5.4-mini, gpt-5.5"
    non_chat_models: "gpt-image-2"
    notes: "gpt-5.5 chat works through this relay when max_tokens is omitted."

# 单次 LLM HTTP 请求超时时间，单位秒。当前中转站偶发慢响应，基线实验使用 180。
llm_timeout: 180

# LLM 请求或 JSON 解析失败后的重试次数。正式 benchmark 至少保留 1 次严格纠错请求；
# 调试连通性时可以临时设为 0，避免每一步等待太久。
llm_max_retries: 1

# 所有 LLM 重试失败后的处理。error 会停止当前 run 并记录错误；action 才会使用确定性动作回退。
llm_fallback_mode: error

# LLM 采样温度。严肃 benchmark 默认 0.0，避免模型采样随机性影响复现实验。
llm_temperature: 0.0

# Prompt 模板风格。default 输出简短 JSON；analysis 要求模型给出局势分析、计算、候选动作比较后再选择 action。
prompt_style: default

# 是否在 prompt 中附加 Compact state JSON。false 可以减少 token 和重复信息；true 适合调试结构化 state。
include_json_state: false

# 是否在 agent prompt 中加入局内短期记忆。这个记忆属于 agent 方法，不属于环境原始 state。
# 如果 context_management.mode 设为 turn_chat，请把这里设为 false，避免两套上下文方法同时生效。
memory_enabled: false

# 短期记忆保留最近多少个已选择 action。数值越大越能记住近期操作，但 prompt 会更长。
memory_window: 8

# 记忆内容类型。action_reason 记录模型旧理由；factual_diff 记录 action 后真实 state 变化，更适合严肃 benchmark。
memory_mode: factual_diff

# 是否在 prompt 中加入规则生成的短 run summary。属于 agent 方法，可用 --no-run-summary 做消融。
run_summary_enabled: false

# Agent 侧上下文管理方法。turn_chat 只在同一个玩家出牌回合内保留短 chat history。
context_management:
  mode: turn_chat
  turn_check:
    enabled: false
  turn_chat:
    # 同一玩家出牌回合内保留最近多少组 user/assistant 消息。
    window: 10
    # 第一版只支持 delta：新回合第一条是完整状态，后续同回合只给更新和合法动作。
    update_mode: delta
    # 第一版只支持 compact：历史里的 assistant 只保留 action 和简短 reason，不保留完整分析。
    assistant_history: compact
    # 是否在每个玩家出牌回合的第一条 turn_chat prompt 中要求模型给 turn_check/plan 类 guardrail。
    plan:
      enabled: false

# 选择角色。可选 Ironclad、Silent、Defect、Regent、Necrobinder。
route_plan:
  enabled: true
  enforcement: hard

# 地图由枚举器自动选择完整可见路线。当前基线：火堆数优先，风险只作为同火堆数下的辅助排序。
route_candidate_objective: max_restsites_low_risk

# OCC 使用旧版 short reference history，以复现前面过 Act 1 的实验设置。
occ_context_mode: reference_turn

# 当前基线关闭多卡 sequence，让 CA 每次只选择一个当前原子动作。
combat_card_sequences_enabled: false

# 当前基线关闭选牌 posterior evaluator，避免和 route/CA 改动混杂。
reward_posterior_evaluator: false

diagnostics:
  self_consistency:
    enabled: false
    samples: 3
    decisions: "map_select,card_reward"
    mode: diagnostic
  reflection_verifier:
    enabled: false
    decisions: "card_reward"
    mode: diagnostic
    max_options: 8
  action_prompt_order:
    mode: default
    seed: 0

character: Ironclad

# 进阶等级。0 表示无进阶，适合初始 benchmark。
ascension: 0

# 状态文本语言。en 使用英文；zh 使用中文。
lang: en

# 固定 seed 文件路径。空字符串表示使用 sts2_bench/seeds_ironclad_a0.json 里的预设固定 seed。
seeds: ""

# 本次运行的局数。
count: 1

# 每局最多允许的决策步数。这是安全上限；最近完整跑法使用 900。
max_steps: 900

# JSONL 输出路径。空字符串表示不写 trace 文件，只在终端打印结果。
out: results/coordinator_deepseek_route_lowrisk.jsonl

# JSONL 记录详细程度。metrics 最小；decisions 记录轻量决策摘要；full 记录完整 state、prompt、raw response。
log_level: decisions

# Generate replay/report artifacts after each benchmark trace is closed.
trace_analysis: true

# 是否在终端打印每一步发给模型的 prompt。调试时可以 true，正式 benchmark 建议 false。
print_prompts: false

# 是否在终端打印模型原始输出、解析结果和最终选择的 action。
print_model_output: false

# 是否在 map_select 决策时自动附加完整地图。false 表示让模型主动选择 view map。
include_full_map: true

# 是否允许同一个 decision 内重复选择 view deck / view map。false 可以避免无意义重复查看。
allow_repeat_views: false
